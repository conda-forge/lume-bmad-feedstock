schema_version: 1

context:
  python_min: "3.11"
  version: "0.1.2"

package:
  name: lume-bmad
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/lume-bmad/lume_bmad-${{ version }}.tar.gz
  sha256: 9c75571ca3e84eaad8d94f15b859ccd540f5aefd9735b6cb6dc6c7b1aa8ee5ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - lume-base
    - openpmd-beamphysics

tests:
  - python:
      imports:
        - lume_bmad
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Tools for using Bmad in LUME
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/lume-science/lume-bmad
  documentation: https://github.com/lume-science/lume-bmad

extra:
  recipe-maintainers:
    - pluflou
